<style>

h1{font-size:2rem;margin-bottom:4px}
.sub{color:var(--mut);margin:0 0 16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

.chip.on{background:var(--ink);color:var(--bg)}

.unit small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tb{text-align:left;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ac);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:baseline}

.tb.h{border-left-color:var(--hl)}
.tag{font-size:.72rem;border:1px solid var(--hl);color:var(--hl);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.back{border:0;background:none;color:var(--ac);padding:0;margin-bottom:14px;font-weight:600}
.page h2{font-size:1.9rem;margin:4px 0 6px}
.page .crumb{color:var(--mut)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px 18px;margin:16px 0}
.box h3{font-size:1.1rem;margin-bottom:8px}
dl{margin:0}dt{font-weight:600;color:var(--ac);margin-top:8px}dd{margin:0}
.ex{border-left:5px solid var(--hl)}
svg{width:100%;max-width:440px;display:block;margin:auto}
svg .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
svg .c1,svg .c1b{stroke:var(--c1);stroke-width:2.5;fill:none}

.cap{text-align:center;color:var(--mut);font-size:.9rem;margin:6px 0 0}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.nav button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:10px 14px}
.none{color:var(--mut);padding:20px 0}

2.6|2|Elasticity of supply|2|el|PES=% change in quantity supplied ÷ % change in price;;spare capacity=Unused resources make supply more elastic;;time period=Supply is more elastic in the long run;;perishability=Hard-to-store goods have inelastic supply|Strawberry supply is inelastic within a season but rises the following year when farmers plant more.

2.9|0|Market failure: public goods|0|none|non-excludable=Cannot stop people from using the good;;non-rivalrous=One person's use doesn't reduce another's;;free rider problem=Benefiting without paying, so markets under-provide;;public good=Non-excludable and non-rivalrous|Street lighting benefits everyone whether they pay or not, so government provides it from taxes.
2.10|1|Market failure: asymmetric information|1|none|asymmetric information=One party knows more than the other;;adverse selection=Hidden information leads to bad choices, e.g. risky people buy insurance;;moral hazard=Risky behaviour once protected from consequences;;signalling=Sending credible information, e.g. a degree|In the used-car market, sellers know more than buyers, so buyers pay less and good cars may leave the market.
2.11|1|Market failure: market power|1|none|market power=Ability of a firm to set price above cost;;monopoly=A single dominant seller with barriers to entry;;barriers to entry=Patents, economies of scale, control of resources;;allocative inefficiency=Price is above marginal cost|A patented medicine can be priced far above its production cost until the patent expires.
2.12|1|The market's inability to achieve equity|1|lorenz|equity=Fairness in the distribution of income and wealth;;progressive tax=Higher rates for higher incomes;;transfer payments=Benefits paid without any good or service in return;;income inequality=Gap between rich and poor|Markets reward skills and assets unequally, so governments use progressive taxes and benefits to redistribute.
3.1|0|Measuring economic activity and illustrating its variations|0|none|GDP=Total value of final goods and services produced in a country in a year;;real vs nominal GDP=Real is adjusted for inflation;;GNI=GDP plus income earned abroad by residents;;business cycle=Fluctuations between booms and recessions|If nominal GDP rises 5% while prices rise 5%, real GDP is unchanged.
3.2|0|Variations in economic activity: AD and AS|0|adas|aggregate demand=Total planned spending: C + I + G + (X − M);;short-run AS=Output firms will supply at each price level when costs are fixed;;long-run AS=Full-employment output, vertical;;recessionary gap=Output below full employment|A fall in consumer confidence shifts AD left, cutting output and raising unemployment.
3.3|2|Macroeconomic objectives|2|adas|inflation=Sustained rise in the general price level;;unemployment=Willing and able to work but without a job;;economic growth=Increase in real GDP over time;;balance of payments=Record of a country's international transactions|Central banks often target about 2% inflation as the stable objective.
3.4|2|Economics of inequality and poverty|2|lorenz|Lorenz curve=Graph of cumulative income share vs cumulative population;;absolute vs relative poverty=Below a fixed income line vs below a share of median income;;redistribution=Taxes and benefits to reduce inequality;;Gini coefficient=0 = perfect equality, 1 = perfect inequality|The further the Lorenz curve bows from the diagonal line, the more unequal the country.
3.5|2|Demand management: monetary policy|2|adas|monetary policy=Central bank controls interest rates and the money supply;;expansionary=Lower interest rates raise spending;;contractionary=Higher interest rates reduce inflation;;quantitative easing=Central bank buys bonds to boost money supply|Cutting interest rates makes borrowing cheaper, increasing investment and shifting AD right.
3.6|2|Demand management: fiscal policy|2|adas|fiscal policy=Government spending and taxation decisions;;budget deficit=Spending exceeds tax revenue;;automatic stabilizers=Taxes and benefits that change with the cycle;;crowding out=Government borrowing raises interest rates and reduces private investment|In a recession, cutting taxes and raising infrastructure spending shifts AD right.

4.7|2|Sustainable development|2|none|economic development=Improvement in living standards, health and education;;HDI=Composite of income, education and life expectancy;;sustainable development=Meets present needs without harming future generations;;ecological footprint=Land area needed to support consumption|Solar power investment raises energy access while limiting emissions.`.split("\n").map(l=>{const p=l.split("|");return{id:p[0],u:+p[0][0]-1,t:p[2],hl:+p[3],g:p[4],terms:p[5].split(";;").map(x=>{const i=x.indexOf("=");return[x.slice(0,i),x.slice(i+1)]}),ex:p[6]}});

const E={
"opportunity cost":["The value of the next best alternative forgone when a choice is made. It applies to consumers, firms and governments because resources are scarce. On a PPC it is shown by the slope: producing more of one good means giving up some of the other, and a bowed-out curve shows increasing opportunity cost.","ppc"],
"demand":["The quantity of a good or service that consumers are willing and able to buy at each price in a given time period, ceteris paribus. The curve slopes downward. A change in price causes a movement along the curve; a change in a non-price determinant (income, tastes, prices of related goods, population, expectations) shifts the whole curve.","shift"],
"law of demand":["As the price of a good rises, the quantity demanded falls, ceteris paribus (and vice versa). It is explained by the income effect (purchasing power falls), the substitution effect (cheaper alternatives are chosen) and diminishing marginal utility.","dem"],
"supply":["The quantity producers are willing and able to sell at each price in a given time period. The curve slopes upward because higher prices raise profit and firms face rising marginal costs. A price change moves along the curve; changes in costs, technology, taxes, subsidies or the number of firms shift it.","sup"],
"equilibrium":["The price and quantity at which quantity demanded equals quantity supplied, so there is no tendency to change. The market clears: shortages push price up and surpluses push it down. A shift in demand or supply creates a new equilibrium.","sd"],
"excess demand (shortage)":["Occurs when quantity demanded exceeds quantity supplied at a price below equilibrium. Competition between buyers bids the price up, which contracts demand and extends supply until equilibrium is restored, unless a price ceiling prevents this.","short"],
"excess supply (surplus)":["Occurs when quantity supplied exceeds quantity demanded at a price above equilibrium. Unsold stock pushes producers to cut prices, which extends demand and contracts supply until the market clears.","excess"],
"consumer and producer surplus":["Consumer surplus is the difference between the maximum price consumers are willing to pay and the price they actually pay (area under D, above price). Producer surplus is the difference between the price received and the minimum price producers would accept (above S, below price). Total surplus measures welfare and is maximized at competitive equilibrium.","surp"],
"PED":["Price elasticity of demand measures the responsiveness of quantity demanded to a change in price: PED = %ΔQd ÷ %ΔP (negative, usually quoted as an absolute value). Determinants: availability of substitutes, necessity vs luxury, proportion of income spent, time period. Steeper curves are more inelastic.","el"],
"PES":["Price elasticity of supply = %ΔQs ÷ %ΔP (positive). Supply is more elastic when firms have spare capacity, stocks, mobile factors of production and time to respond; it is inelastic for goods that are slow to expand, such as agriculture or housing.","el"],
"price ceiling":["A legally imposed maximum price set below equilibrium to make goods affordable (e.g. rent control). Quantity demanded exceeds quantity supplied, causing shortages, queues, black markets and lower quality. Consumers who obtain the good gain; producers and excluded buyers lose.","ceil"],
"price floor":["A legal minimum price set above equilibrium to protect producers or workers (e.g. minimum wage, agricultural support prices). It creates excess supply (surplus or unemployment), may require government to buy the surplus, and can misallocate resources.","floor"],
"indirect tax":["A tax on expenditure (e.g. VAT, excise) collected by firms and passed to government. It raises costs and shifts supply left/up by the amount of the tax. The burden (incidence) is shared between consumers and producers: the more inelastic side bears more. Used to correct negative externalities and raise revenue.","tax"],
"subsidy":["A payment from government to producers that lowers costs and shifts supply right/down, so price falls and quantity rises. Used to encourage goods with positive externalities (e.g. education), but it has an opportunity cost and can distort markets.","sub"],
"externality":["A cost or benefit to a third party who is not part of the transaction. Negative externalities (e.g. pollution) mean marginal social cost exceeds marginal private cost, so the market overproduces; positive externalities (e.g. vaccination) cause underproduction. Responses: taxes, subsidies, regulation, tradable permits.","ext"],
"MPC vs MSC":["MPC is the cost to the producer of one extra unit; MSC = MPC + marginal external cost. The socially optimal output is where MSB = MSC, but the free market produces where MPB = MPC, at a higher quantity, causing a welfare loss.","ext"],
"aggregate demand":["Total planned spending on domestic goods and services at each price level: AD = C + I + G + (X − M). It slopes downward because of the wealth, interest-rate and exchange-rate effects. Changes in confidence, interest rates, taxes or government spending shift AD.","adshift"],
"long-run AS":["Potential output when all resources are fully employed. In the monetarist/new classical view it is vertical because output depends on the quantity and quality of factors of production, not the price level. It shifts right with investment, education, technology or institutional improvements.","lras"],
"recessionary gap":["Actual output is below the full-employment level, leaving spare capacity and cyclical unemployment. Governments can use expansionary policy to shift AD right, or wait for wages and prices to fall (self-correction).","gap"],
"expansionary":["Policy to raise AD. Lower interest rates make borrowing cheaper, raising consumption and investment, and may depreciate the currency, boosting net exports. AD shifts right, raising real GDP and cutting unemployment, but risking inflation.","adshift"],
"economic growth":["An increase in real GDP over time. Short-run growth is a rise in actual output (AD shifts right); long-run growth is an increase in productive capacity, shown by an outward PPC or a rightward LRAS.","ppcshift"],
"comparative advantage":["A country has a comparative advantage when it produces a good at a lower opportunity cost than others. Specializing in those goods and trading allows consumption beyond each country's own PPC. It depends on factor endowments and technology, not on absolute output.","ppc"],
"tariff":["A tax on imported goods. It raises the domestic price, increases domestic output, reduces quantity demanded and imports, and earns government revenue. Domestic producers gain; consumers lose surplus and there is a deadweight welfare loss. It may provoke retaliation.","tariff"],
"exchange rate":["The price of one currency in terms of another, set by the demand for and supply of the currency in a floating system. Demand for a currency comes from exports, foreign investment and speculation.","fx"],
"appreciation/depreciation":["Appreciation is a rise in a currency's value under floating rates; depreciation is a fall. If demand for euros falls (e.g. fewer tourists), the euro depreciates, making exports cheaper and imports dearer.","fxdep"],
"Lorenz curve":["Plots the cumulative share of income against the cumulative share of population. The 45° line shows perfect equality; the further the curve bows away from it, the greater the inequality. Gini = area between the lines ÷ area under the line of equality.","lorenz"]};

sup:[ln(10,15,90,85,"c2","S")+ln(25,15,105,85,"c2","S1"),"More supply (S to S1) shifts the curve right: more is offered at every price.","Price","Quantity"],

["trading bloc","A group of countries that agree to reduce trade barriers among themselves, usually in a geographic region. Blocs differ in how deep the integration goes (see the stages below) and can raise welfare through trade creation or reduce it through trade diversion."],
["trade creation","Occurs when trade within the bloc replaces higher-cost domestic production with lower-cost imports from a member. Consumers pay lower prices, resources move to where the country has a comparative advantage, and allocative efficiency improves."],
["trade diversion","Occurs when the bloc's external barriers shift imports from a lower-cost non-member to a higher-cost member. This is a welfare cost because resources are used less efficiently. A bloc is most beneficial when trade creation outweighs trade diversion."],
["monetary union","A common market with a single currency and common central bank, e.g. the eurozone. It removes exchange-rate risk and transaction costs and makes prices transparent, but members lose independent monetary policy and the exchange rate as a tool to adjust to shocks."],
["economic union","A monetary union that also harmonises fiscal, tax, welfare and regulatory policy. It is the deepest form of integration short of full political union, and needs strong common institutions."]];
